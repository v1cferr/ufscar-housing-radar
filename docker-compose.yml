services:
  app:
    build: .
    image: ufscar-housing-radar
    container_name: housing-radar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persiste o banco no volume montado.
      HR_DATABASE_URL: sqlite:////app/data/housing_radar.db
    ports:
      # Exposto só no loopback; o Caddy (systemd) na frente faz TLS + domínio.
      # 3005 segue a faixa 300x dos projetos (spendflow 3001, dash 3003, files 3004)
      # e evita a 8000 (reservada p/ a API do SpendFlow).
      - "127.0.0.1:3005:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Caddy opcional e self-contained (profile "edge"). Se você já tem um Caddy
  # central no host, ignore isto e use o Caddyfile.example no seu Caddy existente.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
