<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  <meta name="author" content="v1cferr">
  <link rel="canonical" href="{{ meta.url }}">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ meta.title }}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="{{ meta.title }}">
  <meta property="og:description" content="{{ meta.description }}">
  <meta property="og:url" content="{{ meta.url }}">
  <meta property="og:image" content="{{ meta.image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ meta.title }} — apartamentos perto da UFSCar">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta.title }}">
  <meta name="twitter:description" content="{{ meta.description }}">
  <meta name="twitter:image" content="{{ meta.image }}">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('hr-theme');
        if (!t) { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <link rel="stylesheet" href="/static/vendor/tabulator.min.css">
  <style>
    [data-theme="dark"] {
      --bg:#0f1115; --surface:#181b22; --surface-2:#1f232c; --line:#272b34;
      --txt:#e6e8ec; --mut:#9aa3b2; --accent:#4f8cff; --accent-soft:#23304a;
      --hi-bg:#1f3d2b; --hi-tx:#bff5cf; --mid-bg:#23304a; --mid-tx:#cfe0ff;
      --lo-bg:#3d2323; --lo-tx:#f5c9c9; --chip:#1f232c; --shadow:rgba(0,0,0,.35);
    }
    [data-theme="light"] {
      --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e3e6eb;
      --txt:#1a1d23; --mut:#5b6573; --accent:#2563eb; --accent-soft:#e6efff;
      --hi-bg:#e3f6e9; --hi-tx:#1c7a3e; --mid-bg:#e6efff; --mid-tx:#2257c4;
      --lo-bg:#fdeaea; --lo-tx:#c0392b; --chip:#eef1f5; --shadow:rgba(20,30,50,.10);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; background:var(--bg); color:var(--txt);
           font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    .topbar { display:flex; align-items:flex-start; justify-content:space-between;
              gap:16px; padding:20px 16px 12px; max-width:1380px; margin:0 auto; }
    h1 { margin:0; font-size:20px; letter-spacing:-.01em; }
    .sub { color:var(--mut); font-size:13px; margin-top:4px; }
    .sub b { color:var(--txt); font-weight:600; }
    #theme-toggle { flex:0 0 auto; background:var(--surface); color:var(--txt);
            border:1px solid var(--line); border-radius:999px; padding:8px 14px;
            font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; }
    #theme-toggle:hover { border-color:var(--accent); }

    .wrap { padding:0 16px 56px; max-width:1380px; margin:0 auto; }

    .toolbar { display:grid; gap:10px; margin:8px 0 12px; align-items:end;
            grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
    .toolbar .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
    .toolbar label { font-size:12px; color:var(--mut); font-weight:600; }
    .toolbar input { width:100%; background:var(--surface); border:1px solid var(--line);
            color:var(--txt); border-radius:10px; padding:10px 11px; font-size:14px; }
    .toolbar input:focus { outline:none; border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-soft); }
    .toolbar .search { grid-column:1 / -1; }
    .toolbar .inline { flex-direction:row; align-items:center; gap:8px; }
    .toolbar .inline input { width:auto; }
    .toolbar .actions { display:flex; gap:8px; align-items:center; }
    .btn { background:transparent; color:var(--mut); border:1px solid var(--line);
            border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover { color:var(--txt); border-color:var(--accent); }

    .legend { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
            color:var(--mut); font-size:12.5px; margin:0 2px 12px; }
    .legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
            margin-right:5px; vertical-align:middle; }
    .legend .pill { display:inline-flex; align-items:center; padding:2px 9px;
            border-radius:999px; background:var(--chip); font-weight:600; }
    .legend .count b { color:var(--txt); }

    .score { display:inline-block; min-width:38px; text-align:center; font-weight:800;
            padding:3px 8px; border-radius:999px; background:var(--mid-bg); color:var(--mid-tx);
            font-variant-numeric:tabular-nums; }
    .score.high { background:var(--hi-bg); color:var(--hi-tx); }
    .score.low  { background:var(--lo-bg); color:var(--lo-tx); }
    .lnk { color:var(--accent); text-decoration:none; font-weight:600; }
    .lnk:hover { text-decoration:underline; }
    .title-main { line-height:1.3; }
    .dup { color:var(--mut); font-size:12px; margin-top:2px; }
    .sub { color:var(--mut); font-size:12px; }
    .dash { color:var(--mut); }
    .chip { display:inline-block; padding:2px 9px; border-radius:999px; background:var(--chip);
            color:var(--mut); font-size:12px; font-weight:600; }
    .real { color:var(--accent); font-weight:700; margin-left:3px; }

    /* ---- Tema do Tabulator (sobrescreve o default cinza) ------------------- */
    .tabulator { background:transparent; border:1px solid var(--line); border-radius:14px;
            font-size:14px; box-shadow:0 1px 3px var(--shadow); overflow:hidden; }
    .tabulator .tabulator-header { background:var(--surface-2); border-bottom:1px solid var(--line);
            color:var(--mut); }
    .tabulator .tabulator-header .tabulator-col { background:var(--surface-2); border-right:0; }
    .tabulator .tabulator-header .tabulator-col .tabulator-col-content { padding:10px 12px; }
    .tabulator .tabulator-header .tabulator-col-title { color:var(--mut); font-weight:700;
            font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; }
    .tabulator .tabulator-header .tabulator-col.tabulator-sortable:hover { background:var(--line); }
    .tabulator-row { background:var(--surface); border-bottom:1px solid var(--line); color:var(--txt); }
    .tabulator-row.tabulator-row-even { background:var(--surface); }
    .tabulator-row.tabulator-selectable:hover, .tabulator-row:hover { background:var(--surface-2); }
    .tabulator .tabulator-cell { border-right:0; padding:9px 12px; }
    .tabulator .tabulator-cell.tabulator-row-header { background:var(--surface-2); }
    .tabulator-row .tabulator-cell.tabulator-frozen { background:var(--surface); }
    .tabulator .tabulator-footer { background:var(--surface-2); border-top:1px solid var(--line);
            color:var(--mut); }
    .tabulator .tabulator-footer .tabulator-page,
    .tabulator .tabulator-footer .tabulator-pages { color:var(--txt); }
    .tabulator .tabulator-footer .tabulator-page { background:var(--surface); border:1px solid var(--line);
            border-radius:8px; margin:2px; }
    .tabulator .tabulator-footer .tabulator-page:not(.disabled):hover { background:var(--accent);
            color:#fff; border-color:var(--accent); }
    .tabulator .tabulator-footer .tabulator-page.active { background:var(--accent); color:#fff;
            border-color:var(--accent); }
    .tabulator .tabulator-footer .tabulator-page-size { background:var(--surface); color:var(--txt);
            border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
    .tabulator-row .tabulator-responsive-collapse { border-top:1px solid var(--line); padding:8px 12px; }
    .tabulator-responsive-collapse table tr td { color:var(--txt); }
    .tabulator-responsive-collapse table tr td:first-of-type { color:var(--mut); }
    .tabulator .tabulator-col-sorter .tabulator-arrow { border-bottom-color:var(--mut); }
    .tabulator .tabulator-col[aria-sort="ascending"] .tabulator-arrow,
    .tabulator .tabulator-col[aria-sort="descending"] .tabulator-arrow { border-bottom-color:var(--accent); }
    .tabulator-row .tabulator-responsive-collapse-toggle { background:var(--accent); }
    .tabulator .tabulator-placeholder { color:var(--mut); }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>UFSCar Housing Radar</h1>
      <div class="sub">Apartamentos perto da <b>{{ destination }}</b> — ordene clicando no cabeçalho, filtre na hora.</div>
    </div>
    <button id="theme-toggle" type="button" aria-label="Alternar tema">
      <span id="theme-ico">◐</span> <span id="theme-lbl">Tema</span>
    </button>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="field search">
        <label for="q">Buscar (título, bairro ou fonte)</label>
        <input id="q" type="search" list="bairros" placeholder="ex.: Santa Felícia, Jockey Clube, vivareal…">
      </div>
      <div class="field"><label for="max_price">Preço máx. (R$)</label><input id="max_price" type="number" inputmode="numeric" step="10000" placeholder="R$"></div>
      <div class="field"><label for="min_area">Área mín. (m²)</label><input id="min_area" type="number" inputmode="numeric" step="5" placeholder="m²"></div>
      <div class="field"><label for="min_bedrooms">Quartos mín.</label><input id="min_bedrooms" type="number" inputmode="numeric" min="0" placeholder="nº"></div>
      <div class="field"><label for="max_car_min">Carro máx. (min)</label><input id="max_car_min" type="number" inputmode="numeric" min="0" placeholder="min"></div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="actions">
          <label class="inline" title="Junta o mesmo imóvel anunciado em fontes diferentes"><input id="group" type="checkbox" checked> Agrupar duplicatas</label>
          <button id="clear" class="btn" type="button">Limpar</button>
        </div>
      </div>
    </div>

    <datalist id="bairros">{% for n in neighborhoods %}<option value="{{ n }}"></option>{% endfor %}</datalist>

    <div class="legend">
      <span class="count"><b id="count">—</b> resultados</span>
      <span><span class="dot" style="background:var(--hi-tx)"></span>Score ≥ 70</span>
      <span><span class="dot" style="background:var(--mid-tx)"></span>45–69</span>
      <span><span class="dot" style="background:var(--lo-tx)"></span>&lt; 45</span>
      <span class="pill">A pé / Bici / Carro = tempo até a UFSCar (min)</span>
      <span><span class="real">•</span> tempo real (ORS); sem marca = estimativa</span>
    </div>

    <div id="grid"></div>
  </div>

  <script src="/static/vendor/tabulator.min.js"></script>
  <script>
    // ---- helpers ----
    var DASH = '<span class="dash">—</span>';
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
    function num(v){ v = (v == null ? '' : v).toString().replace(',', '.').trim();
      if (v === '') return null; var n = parseFloat(v); return isNaN(n) ? null : n; }
    function brl(v){ return (v == null) ? DASH : 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }

    // Ordena números colocando vazios (—) SEMPRE por último, nas duas direções.
    function numSort(a, b, aRow, bRow, column, dir){
      var ae = (a == null || a === ''), be = (b == null || b === '');
      if (ae && be) return 0;
      if (ae || be){ var r = ae ? 1 : -1; return dir === 'desc' ? -r : r; }
      return a - b;
    }

    // ---- formatters ----
    function fScore(c){ var v = c.getValue(); if (v == null) return DASH;
      var k = v >= 70 ? 'high' : (v < 45 ? 'low' : 'mid');
      return '<span class="score ' + k + '">' + Math.round(v) + '</span>'; }
    function fTitle(c){ var d = c.getData(); var t = d.title || 'Sem título';
      var main = d.url ? '<a class="lnk" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(t) + '</a>' : esc(t);
      var dup = (d.dup_count > 1) ? '<div class="dup">também em ' + d.dup_count + ' fontes: ' + esc((d.dup_sources || []).join(', ')) + '</div>' : '';
      return '<div class="title-main">' + main + '</div>' + dup; }
    function fPrice(c){ return brl(c.getValue()); }
    function fRent(c){ var v = c.getValue(); return v == null ? DASH : brl(v) + '<span class="sub">/mês</span>'; }
    function fArea(c){ var v = c.getValue(); return v == null ? DASH : Math.round(v) + ' m²'; }
    function fKm(c){ var v = c.getValue(); return v == null ? DASH : v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' km'; }
    function fInt(c){ var v = c.getValue(); return v == null ? DASH : v; }
    function fMin(c){ var v = c.getValue(); if (v == null) return DASH;
      var dot = (c.getData().travel_provider === 'ors') ? '<span class="real" title="tempo real (OpenRouteService)">•</span>' : '';
      return Math.round(v) + ' min' + dot; }
    function fChip(c){ return '<span class="chip">' + esc(c.getValue()) + '</span>'; }

    var R = 'right', C = 'center';
    var columns = [
      {title:'Score', field:'score', formatter:fScore, hozAlign:C, sorter:numSort, width:84, responsive:0, headerSortStartingDir:'desc'},
      {title:'Apartamento', field:'title', formatter:fTitle, headerSort:false, widthGrow:3, minWidth:230, responsive:0},
      {title:'Bairro', field:'neighborhood', minWidth:130, responsive:2},
      {title:'Preço (R$)', field:'price', formatter:fPrice, sorter:numSort, hozAlign:R, minWidth:110, responsive:0},
      {title:'Aluguel (R$)', field:'rent_price', formatter:fRent, sorter:numSort, hozAlign:R, minWidth:110, responsive:7},
      {title:'Cond. (R$)', field:'condo_fee', formatter:fPrice, sorter:numSort, hozAlign:R, minWidth:105, responsive:8},
      {title:'Área (m²)', field:'area_m2', formatter:fArea, sorter:numSort, hozAlign:R, minWidth:95, responsive:3},
      {title:'Quartos', field:'bedrooms', formatter:fInt, sorter:numSort, hozAlign:C, minWidth:80, responsive:4},
      {title:'Banh.', field:'bathrooms', formatter:fInt, sorter:numSort, hozAlign:C, minWidth:72, responsive:9},
      {title:'Vagas', field:'parking_spots', formatter:fInt, sorter:numSort, hozAlign:C, minWidth:72, responsive:9},
      {title:'Distância (km)', field:'dist_ufscar_km', formatter:fKm, sorter:numSort, hozAlign:R, minWidth:110, responsive:6},
      {title:'A pé (min)', field:'time_walk_min', formatter:fMin, sorter:numSort, hozAlign:R, minWidth:95, responsive:10},
      {title:'Bici (min)', field:'time_bike_min', formatter:fMin, sorter:numSort, hozAlign:R, minWidth:95, responsive:10},
      {title:'Carro (min)', field:'time_car_min', formatter:fMin, sorter:numSort, hozAlign:R, minWidth:100, responsive:1},
      {title:'Fonte', field:'source', formatter:fChip, minWidth:95, responsive:5},
    ];

    var table = new Tabulator('#grid', {
      layout: 'fitColumns',
      responsiveLayout: 'collapse',
      responsiveLayoutCollapseStartOpen: false,
      placeholder: 'Nenhum apartamento encontrado.',
      pagination: true,
      paginationMode: 'local',
      paginationSize: 20,
      paginationSizeSelector: [10, 20, 30, 50, 100, true],
      paginationCounter: 'rows',
      movableColumns: true,
      initialSort: [{column:'score', dir:'desc'}],
      columnDefaults: { headerHozAlign:'left', resizable:true, headerTooltip:true, title:'' },
      columns: columns,
    });

    // ---- filtros instantâneos (cliente) ----
    var els = ['q','max_price','min_area','min_bedrooms','max_car_min'].map(function(i){ return document.getElementById(i); });
    function applyFilters(){
      var q = (els[0].value || '').trim().toLowerCase();
      var maxP = num(els[1].value), minA = num(els[2].value), minB = num(els[3].value), maxCar = num(els[4].value);
      table.setFilter(function(row){
        if (q){ var hay = ((row.title||'') + ' ' + (row.neighborhood||'') + ' ' + (row.source||'')).toLowerCase();
          if (hay.indexOf(q) === -1) return false; }
        if (maxP != null && (row.price == null || row.price > maxP)) return false;
        if (minA != null && (row.area_m2 == null || row.area_m2 < minA)) return false;
        if (minB != null && (row.bedrooms == null || row.bedrooms < minB)) return false;
        if (maxCar != null && (row.time_car_min == null || row.time_car_min > maxCar)) return false;
        return true;
      });
    }
    els.forEach(function(el){ el.addEventListener('input', applyFilters); });
    document.getElementById('clear').addEventListener('click', function(){
      els.forEach(function(el){ el.value = ''; }); table.clearFilter(); });

    var countEl = document.getElementById('count');
    table.on('dataFiltered', function(filters, rows){ countEl.textContent = rows.length.toLocaleString('pt-BR'); });

    // ---- carregar dados (re-busca ao alternar agrupamento) ----
    function load(){
      var g = document.getElementById('group').checked ? '1' : '0';
      fetch('/api/listings?limit=5000&group=' + g)
        .then(function(r){ return r.json(); })
        .then(function(data){ table.setData(data).then(applyFilters); })
        .catch(function(){ countEl.textContent = 'erro ao carregar'; });
    }
    document.getElementById('group').addEventListener('change', load);
    table.on('tableBuilt', load);

    // ---- tema ----
    (function(){
      var root = document.documentElement;
      function apply(t){ root.setAttribute('data-theme', t);
        var ico = document.getElementById('theme-ico'), lbl = document.getElementById('theme-lbl');
        if (ico) ico.textContent = t === 'dark' ? '☀' : '☾';
        if (lbl) lbl.textContent = t === 'dark' ? 'Claro' : 'Escuro'; }
      apply(root.getAttribute('data-theme') || 'dark');
      document.getElementById('theme-toggle').addEventListener('click', function(){
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('hr-theme', next); } catch (e) {}
        apply(next);
      });
    })();
  </script>
</body>
</html>
